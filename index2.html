<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frequency Shift</title>

<link rel="icon" href="images/favicon.ico" sizes="any">

<link
    href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    font-family: 'Anton', sans-serif;
    background: #fff;
    color: #201E1F;
    overflow: hidden;
}

.site-title,
.site-nav a,
.project-card-title,
.project-card-meta {
    font-family: 'Anton', sans-serif;
}

/* =====================================
   TOPOGRAPHIC / VIOLIN-STRING BACKGROUND
===================================== */

#topographic {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.55;
}

/* =====================================
   HEADER
===================================== */

.site-header {
    position: fixed;
    /* top: -50px;
    left: -15px; */
    width: 100%;
    padding: 52px 32px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    z-index: 100;
    pointer-events: none;
}

.site-title {
    display: block;

    width: 250px;

    line-height: 0;

    pointer-events: auto;
}

.site-title img {
    display: block;

    width: 100%;
    height: auto;

    /* object-fit: contain; */
    transform: translateY(-60px);
}

.site-nav {
    display: flex;
    align-items: center;
    gap: 28px;
    padding-top: 20px;
    pointer-events: auto;
}

.site-nav a {
    color: #000;
    text-decoration: none;
    font-size: 26px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.65;
    transition: opacity 0.25s ease;
}

.site-nav a:hover {
    opacity: 1;
}

/* =====================================
   ARCHIVE
===================================== */

.archive {
    position: absolute;
    top: 90px;
    left: 0;
    width: 100%;
    height: calc(100vh - 170px);
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
    perspective-origin: center center;
    overflow: visible;
    z-index: 10;
}

.glide {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
    perspective-origin: center center;
    overflow: visible;
    touch-action: pan-y;
}

.glide__track,
.glide__slides {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: visible;
    transform-style: preserve-3d;
}

.glide__slides {
    list-style: none;
}

/* =====================================
   PROJECT SLIDES
===================================== */

.glide__slide {
    position: absolute;
    left: 50%;
    top: 50%;

    width: min(46vw, 760px);
    height: min(62vh, 650px);

    overflow: visible;
    transform-style: preserve-3d;
    transform-origin: center center;
    will-change: transform, opacity;

    transition:
        transform 900ms cubic-bezier(0.77, 0, 0.175, 1),
        opacity 700ms ease,
        filter 700ms ease;

    margin-left: calc(min(46vw, 760px) / -2);
    margin-top: calc(min(62vh, 650px) / -2);

    cursor: pointer;
}

/* =====================================
   PROJECT CARD
===================================== */

.project-card {
    width: 100%;
    height: 100%;
    background: #FFF0E7;

    display: flex;
    flex-direction: column;

    overflow: hidden;

    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.08);

    box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.12);

    transform-style: preserve-3d;
    color: inherit;
    text-decoration: none;
}

.project-image-wrapper {
    position: relative;
    width: 100%;
    height: 82%;
    overflow: hidden;
    background: #eee;
}

.project-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transform: scale(1);
    user-select: none;
    -webkit-user-drag: none;
    transition: transform 1s ease;
}

.glide__slide.is-active .project-image {
    transform: scale(1.015);
}

.project-card-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 18px 24px 20px;
    background: #fff;
    color: #201E1F;
}

.project-card-title {
    font-size: clamp(22px, 2.5vw, 36px);
    font-weight: 400;
    line-height: 0.95;
    letter-spacing: 0.01em;
    margin-bottom: 9px;
    color: #201E1F;

}

.project-card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.55;
}

.glide__slide.is-active {
    cursor: grab;
}

.glide__slide.is-active:active {
    cursor: grabbing;
}

/* =====================================
   PROGRESS
===================================== */

.progress {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 2px;
    background: rgba(0, 0, 0, 0.12);
    z-index: 110;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #201E1F;
    transition: width 0.5s ease;
}

/* =====================================
   MOBILE
===================================== */

@media (max-width: 700px) {

    .site-header {
        padding: 20px 18px;
        align-items: center;
    }

    .site-title {
        font-size: 18px;
    }

    .site-nav {
        gap: 14px;
        padding-top: 10px;
    }

    .site-nav a {
        font-size: 15px;
    }

    .archive {
        top: 75px;
        height: calc(100vh - 150px);
        perspective: 900px;
    }

    .glide {
        perspective: 900px;
    }

    .glide__slide {
        width: 78vw;
        height: 58vh;
        margin-left: -39vw;
        margin-top: -29vh;
    }

    .project-image-wrapper {
        height: 78%;
    }

    .project-card-info {
        padding: 14px 17px 16px;
    }

    .project-card-title {
        font-size: clamp(18px, 5vw, 26px);
        margin-bottom: 7px;
    }

    .project-card-meta {
        font-size: 9px;
        gap: 7px;
    }

    #topographic {
        opacity: 0.42;
    }
}
</style>


</head>

<canvas id="topographic"></canvas>

                            <div class="project-card-title">Calotropis Archive</div>

<script>

/* =====================================
   PROJECT DATA
===================================== */

const projects = [
    { title: "Calotropis", year: "2024", location: "The Mall, Nairobi" },
    { title: "Munyu", year: "2025", location: "The Mall, Nairobi" },
    { title: "Calotropis Archive", year: "2024", location: "Calotropis Episode Archive" },
    { title: "unfoldmen II", year: "2023", location: "Berlin" },
    { title: "Sana Sana", year: "2022", location: "Accra" }
];


/* =====================================
   CAROUSEL ELEMENTS
===================================== */

const slides = Array.from(
    document.querySelectorAll('.glide__slide')
);

const progressBar =
    document.getElementById('progress-bar');

const carousel =
    document.querySelector('.glide');


/* =====================================
   CAROUSEL STATE
===================================== */

let currentIndex = 0;
let autoplayTimer = null;

let isDragging = false;
let dragStartX = 0;
let dragCurrentX = 0;


/* =====================================
   TURNTABLE SETTINGS
===================================== */

const settings = {
    spread: 200,
    depth: 240,
    rotation: 34,
    sideScale: 0.82,
    farScale: 0.62,
    sideOpacity: 0.72,
    verticalCurve: 18
};


/* =====================================
   CIRCULAR DISTANCE
===================================== */

function getDistance(index, active) {

    const total = slides.length;
    let distance = index - active;

    if (distance > total / 2) {
        distance -= total;
    }

    if (distance < -total / 2) {
        distance += total;
    }

    return distance;
}


/* =====================================
   RENDER TURN TABLE
===================================== */

function render() {

    slides.forEach((slide, index) => {

        const distance =
            getDistance(index, currentIndex);

        const abs =
            Math.abs(distance);


        if (distance === 0) {

            slide.style.transform = `
                translate3d(0px, 0px, 80px)
                rotateY(0deg)
                scale(1)
            `;

            slide.style.opacity = '1';
            slide.style.filter = 'brightness(1)';
            slide.style.zIndex = '50';

            slide.classList.add('is-active');

            return;
        }


        slide.classList.remove('is-active');


        if (abs > 2) {

            slide.style.opacity = '0';
            slide.style.pointerEvents = 'none';
            slide.style.zIndex = '0';

            return;
        }


        slide.style.pointerEvents = 'auto';


        const direction =
            distance < 0 ? -1 : 1;


        const x =
            direction *
            settings.spread *
            abs;


        const z =
            -settings.depth *
            abs;


        const y =
            settings.verticalCurve *
            abs;


        const rotation =
            -direction *
            settings.rotation;


        const scale =
            abs === 1
                ? settings.sideScale
                : settings.farScale;


        const opacity =
            abs === 1
                ? settings.sideOpacity
                : 0.25;


        slide.style.transform = `
            translate3d(
                ${x}px,
                ${y}px,
                ${z}px
            )
            rotateY(${rotation}deg)
            scale(${scale})
        `;


        slide.style.opacity =
            opacity;

        slide.style.filter =
            abs === 1
                ? 'brightness(0.7)'
                : 'brightness(0.5)';

        slide.style.zIndex =
            String(50 - abs);

    });


    updateProgress();
}


/* =====================================
   PROGRESS
===================================== */

function updateProgress() {

    progressBar.style.width =
        (
            (
                currentIndex + 1
            )
            /
            projects.length
        )
        * 100
        + '%';
}


/* =====================================
   NAVIGATION
===================================== */

function goTo(index) {

    const total = projects.length;

    if (index < 0) {
        index = total - 1;
    }

    if (index >= total) {
        index = 0;
    }

    currentIndex = index;

    render();
    restartAutoplay();
}


function next() {
    goTo(currentIndex + 1);
}


function previous() {
    goTo(currentIndex - 1);
}


/* =====================================
   AUTOPLAY
===================================== */

function startAutoplay() {

    clearInterval(autoplayTimer);

    autoplayTimer =
        setInterval(() => {
            next();
        }, 5000);
}


function restartAutoplay() {
    startAutoplay();
}


/* =====================================
   MOUSE DRAG
===================================== */

carousel.addEventListener(
    'pointerdown',
    event => {

        isDragging = true;

        dragStartX =
            event.clientX;

        dragCurrentX =
            event.clientX;

        carousel.setPointerCapture(
            event.pointerId
        );

        clearInterval(
            autoplayTimer
        );
    }
);


carousel.addEventListener(
    'pointermove',
    event => {

        if (!isDragging) {
            return;
        }

        dragCurrentX =
            event.clientX;
    }
);


carousel.addEventListener(
    'pointerup',
    event => {

        if (!isDragging) {
            return;
        }

        isDragging = false;

        const distance =
            dragCurrentX -
            dragStartX;

        if (Math.abs(distance) > 60) {

            if (distance < 0) {
                next();
            } else {
                previous();
            }
        }

        restartAutoplay();
    }
);


carousel.addEventListener(
    'pointercancel',
    () => {

        isDragging = false;
        restartAutoplay();
    }
);


/* =====================================
   KEYBOARD
===================================== */

document.addEventListener(
    'keydown',
    event => {

        if (event.key === 'ArrowRight') {
            next();
        }

        if (event.key === 'ArrowLeft') {
            previous();
        }
    }
);


/* =====================================
   TOUCH
===================================== */

let touchStartX = 0;

carousel.addEventListener(
    'touchstart',
    event => {

        touchStartX =
            event.touches[0].clientX;

        clearInterval(
            autoplayTimer
        );
    },
    { passive: true }
);


carousel.addEventListener(
    'touchend',
    event => {

        const touchEndX =
            event.changedTouches[0].clientX;

        const distance =
            touchEndX -
            touchStartX;

        if (Math.abs(distance) > 50) {

            if (distance < 0) {
                next();
            } else {
                previous();
            }
        }

        restartAutoplay();
    },
    { passive: true }
);


/* =====================================
   INITIALIZE CAROUSEL
===================================== */

render();
startAutoplay();


/* =====================================
   TOPOGRAPHIC STRING BACKGROUND

   Slow vertical lines inspired by
   violin strings and topographic maps.

   Subtle mouse interaction.
===================================== */

const canvas =
    document.getElementById(
        'topographic'
    );

const ctx =
    canvas.getContext('2d');

let canvasWidth = 0;
let canvasHeight = 0;
let pixelRatio = 1;


function resizeTopographic() {

    pixelRatio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvasWidth =
        window.innerWidth;

    canvasHeight =
        window.innerHeight;

    canvas.width =
        canvasWidth *
        pixelRatio;

    canvas.height =
        canvasHeight *
        pixelRatio;

    canvas.style.width =
        canvasWidth + 'px';

    canvas.style.height =
        canvasHeight + 'px';

    ctx.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );
}


window.addEventListener(
    'resize',
    resizeTopographic
);

resizeTopographic();


/* =====================================
   SMOOTH MOUSE POSITION
===================================== */

let mouseX = 0.5;
let mouseY = 0.5;

let smoothMouseX = 0.5;
let smoothMouseY = 0.5;


window.addEventListener(
    'pointermove',
    event => {

        mouseX =
            event.clientX /
            window.innerWidth;

        mouseY =
            event.clientY /
            window.innerHeight;

    }
);


function drawTopographic(time) {

    ctx.clearRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );


    /* =====================================
       SMOOTH MOUSE MOVEMENT
    ===================================== */

    smoothMouseX +=
        (
            mouseX -
            smoothMouseX
        ) * 0.035;


    smoothMouseY +=
        (
            mouseY -
            smoothMouseY
        ) * 0.035;



    /* =====================================
       VERTICAL STRINGS
    ===================================== */

    const lineCount =
        Math.max(
            200,
            Math.floor(
                canvasWidth / 10
            )
        );


    const spacing =
        canvasWidth /
        (lineCount - 1);


    /*
     * Very slow natural movement.
     */

    const animation =
        time * 0.00018;



    for (
        let line = 0;
        line < lineCount;
        line++
    ) {


        const baseX =
            line * spacing;


        ctx.beginPath();


        const points = 180;



        for (
            let point = 0;
            point <= points;
            point++
        ) {


            const normalizedY =
                point / points;


            const y =
                normalizedY *
                canvasHeight;



            /* =================================
               NATURAL TOPOGRAPHIC WAVES
            ================================= */

            const waveOne =
                Math.sin(
                    normalizedY *
                    Math.PI *
                    2 *
                    1.15 +
                    animation
                );


            const waveTwo =
                Math.sin(
                    normalizedY *
                    Math.PI *
                    2 *
                    2.35 -
                    animation * 0.7
                );


            const waveThree =
                Math.sin(
                    normalizedY *
                    Math.PI *
                    2 *
                    0.55 +
                    animation * 0.45
                );



            /* =================================
               TOPOGRAPHIC ZONES
            ================================= */

            const zoneOne =
                Math.exp(
                    -Math.pow(
                        (
                            normalizedY -
                            0.23
                        ) / 0.18,
                        2
                    )
                );


            const zoneTwo =
                Math.exp(
                    -Math.pow(
                        (
                            normalizedY -
                            0.53
                        ) / 0.20,
                        2
                    )
                );


            const zoneThree =
                Math.exp(
                    -Math.pow(
                        (
                            normalizedY -
                            0.78
                        ) / 0.16,
                        2
                    )
                );



            /* =================================
               BASE CONTOUR
            ================================= */

            let offset =

                waveOne *
                18 *
                zoneOne

                +

                waveTwo *
                26 *
                zoneTwo

                +

                waveThree *
                20 *
                zoneThree;

            /* =================================
            TERRAIN / CONTOUR FIELD
            ================================= */

            /* =================================
               MOVING MOUNTAIN / CONTOUR FIELD
            ================================= */

            const terrainTime =
                time * 0.00011;

            const mountainOneX =
                canvasWidth *
                (0.28 + Math.sin(terrainTime * 0.65) * 0.12);

            const mountainOneY =
                0.34 + Math.sin(terrainTime * 0.52) * 0.09;

            const mountainTwoX =
                canvasWidth *
                (0.72 + Math.sin(terrainTime * 0.42 + 2) * 0.14);

            const mountainTwoY =
                0.68 + Math.cos(terrainTime * 0.58) * 0.10;

            const distanceOne = Math.sqrt(
                Math.pow((baseX - mountainOneX) / (canvasWidth * 0.18), 2) +
                Math.pow((normalizedY - mountainOneY) / 0.25, 2)
            );

            const distanceTwo = Math.sqrt(
                Math.pow((baseX - mountainTwoX) / (canvasWidth * 0.20), 2) +
                Math.pow((normalizedY - mountainTwoY) / 0.23, 2)
            );

            const mountainOne =
                Math.exp(-distanceOne * distanceOne);

            const mountainTwo =
                Math.exp(-distanceTwo * distanceTwo);

            const contourOne =
                Math.sin(distanceOne * 18) *
                mountainOne *
                34;

            const contourTwo =
                Math.sin(distanceTwo * 20) *
                mountainTwo *
                38;

            const terrainDrift =
                Math.sin(
                    normalizedY *
                    Math.PI *
                    2 +
                    terrainTime
                ) *
                5;

            offset +=
                contourOne +
                contourTwo +
                terrainDrift;

            /* =================================
               GENTLE OVERALL CURVE
            ================================= */

            offset +=

                Math.sin(
                    normalizedY *
                    Math.PI *
                    2 +
                    line *
                    0.018
                ) * 7;



            /* =================================
               MOUSE INFLUENCE
            ================================= */

            /*
             * Convert mouse position into
             * page coordinates.
             */

            const mousePixelX =
                smoothMouseX *
                canvasWidth;


            const mousePixelY =
                smoothMouseY *
                canvasHeight;



            /*
             * Distance from this point
             * to the mouse.
             */

            const dx =
                baseX -
                mousePixelX;


            const dy =
                y -
                mousePixelY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );



            /*
             * Radius of the mouse influence.
             */

            const influenceRadius =
                Math.min(
                    canvasWidth,
                    canvasHeight
                ) * 0.38;



            /*
             * Smooth falloff.
             */

            const influence =
                Math.max(
                    0,
                    1 -
                    distance /
                    influenceRadius
                );


            /*
             * Smooth the falloff so
             * there isn't a hard circle.
             */

            const smoothInfluence =
                influence *
                influence *
                (
                    3 -
                    2 * influence
                );



            /*
             * Push the strings sideways
             * toward/away from the mouse.
             */

            const mousePush =

                (
                    mousePixelX -
                    baseX
                )
                *
                0.035
                *
                smoothInfluence;



            /*
             * Add a small vertical
             * displacement as well.
             *
             * This makes the contours
             * feel three-dimensional.
             */

            const mouseWave =

                Math.sin(
                    normalizedY *
                    Math.PI
                    *
                    2
                    +
                    smoothMouseX *
                    3
                )
                *
                8
                *
                smoothInfluence;



            offset +=
                mousePush
                +
                mouseWave;



            /* =================================
               FINAL POSITION
            ================================= */

            const x =
                baseX +
                offset;



            if (
                point === 0
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            } else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }



        /* =================================
           DRAW STRING
        ================================= */

        ctx.strokeStyle =
            'rgba(32, 30, 31, 0.22)';

        ctx.lineWidth =
            1.05;

        ctx.stroke();

    }


    requestAnimationFrame(
        drawTopographic
    );

}


requestAnimationFrame(
    drawTopographic
);

</script>

</body>
</html>
